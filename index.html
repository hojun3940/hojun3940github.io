<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#e3e1da; --accent:#264b7a; --accent-soft:#e8eef6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14181f;--surface:#1b212b;--ink:#e9ecf2;--muted:#9aa3b5;--line:#2c3441;--accent:#8fb4e8;--accent-soft:#222c3b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14181f;--surface:#1b212b;--ink:#e9ecf2;--muted:#9aa3b5;--line:#2c3441;--accent:#8fb4e8;--accent-soft:#222c3b;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.75;font-size:16px}
html[lang="ja"] body{font-family:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:260px 1fr;gap:56px}
aside{position:sticky;top:32px;align-self:start}
.photo{width:160px;height:160px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:48px;font-weight:700;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
h1{font-size:28px;line-height:1.3;margin:20px 0 4px}
.role{color:var(--accent);font-weight:500;margin:0 0 16px}
.facts{list-style:none;padding:0;margin:0 0 20px;color:var(--muted);font-size:14px}
.facts li{padding:2px 0}
.facts a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-size:14px;padding:6px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:500}
.lang button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{padding-bottom:36px}
h2{font-size:20px;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
p{margin:0 0 12px;max-width:62ch}
.tl{border-left:2px solid var(--line);margin-left:4px;padding-left:20px}
.item{position:relative;margin-bottom:18px}
.item::before{content:"";position:absolute;left:-27px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.item .when{font-size:13px;color:var(--muted)}
.item .what{font-weight:700}
.item .where{color:var(--muted);font-size:14px}
.item p{margin:4px 0 0;font-size:15px}
.jp{display:grid;gap:12px}
.jp .row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:15px}
.bar{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.jp small{color:var(--muted);display:block;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.tags li{background:var(--accent-soft);color:var(--accent);padding:3px 12px;border-radius:6px;font-size:14px}
footer{color:var(--muted);font-size:13px;padding-top:8px}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;gap:28px;padding:32px 20px}
  aside{position:static}
  .jp .row{grid-template-columns:1fr}
}
@media print{
  .lang{display:none}
  body{background:#fff;color:#000}
  .wrap{padding:0;grid-template-columns:200px 1fr;gap:28px}
  aside{position:static}
}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="photo" id="photo"></div>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <ul class="facts" id="facts"></ul>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="ko">한국어</button><button data-l="ja">日本語</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ===== 여기만 수정하세요 / ここだけ編集してください =====
   [대괄호] 안의 내용을 본인 정보로 바꾸면 됩니다.
   사진: PHOTO에 "photo.jpg" 처럼 파일명을 넣으세요 (같은 폴더에 사진 파일 업로드). */
const PHOTO = "";
const COMMON = { github:"https://github.com/hojun3940", email:"hojun3940@gmail.com", initials:"심" };

const DATA = {
ko:{
  name:"심호준", role:"경영·경제 전공 | 일본 IT 취업 준비",
  facts:["[서울, 한국]","[일본 취업 희망 시기: 2027년 4월]"],
  labels:{about:"소개", jp:"일본어", ov:"해외 경험", ed:"학력·자격", sk:"스킬", pj:"프로젝트"},
  about:["[경영·경제를 전공하고 데이터와 비즈니스를 연결하는 일에 관심이 있습니다. 일본 IT 기업에서 ○○ 직무로 일하는 것이 목표입니다.]",
         "[강점 한두 가지를 구체적인 경험과 함께 적어주세요.]"],
  jp:[{n:"JLPT",lv:"N1 (155/180점)",p:86,d:""},
      {n:"회화",lv:"상급",p:80,d:""},
      {n:"읽기·쓰기",lv:"상급",p:80,d:""},
      {n:"TOEIC",lv:"750점",p:75,d:""}],
  ov:[{w:"2025.04 – 2026.02",t:"일본 교환학생",s:"킨키대학(近畿大学), 오사카",d:""}],
  ed:[{w:"[입학 연월 – 졸업(예정) 연월]",t:"한성대학교 경영학과",s:"",d:"[학점, 관련 수업 등]"},
      {w:"[시험 예정 연월]",t:"IT패스포트(ITパスポート) 취득 예정",s:"IPA(일본 정보처리추진기구)",d:""}],
  sk:["Python","Git","Excel"],
  pj:["[프로젝트 사이트 링크 – 곧 추가 예정]"],
  foot:"이력서 첨부용 페이지 · 인쇄(PDF 저장) 지원"
},
ja:{
  name:"シム・ホジュン", role:"経営・経済専攻｜日本のIT企業を目指しています",
  facts:["[ソウル、韓国]","[入社希望時期：2027年4月]"],
  labels:{about:"自己紹介", jp:"日本語力", ov:"海外経験", ed:"学歴・資格", sk:"スキル", pj:"プロジェクト"},
  about:["[経営・経済を専攻し、データとビジネスをつなぐ仕事に関心があります。日本のIT企業で○○職として働くことが目標です。]",
         "[強みを一、二点、具体的な経験とともに記入してください。]"],
  jp:[{n:"JLPT",lv:"N1（155/180点）",p:86,d:""},
      {n:"会話",lv:"上級",p:80,d:""},
      {n:"読み書き",lv:"上級",p:80,d:""},
      {n:"TOEIC",lv:"750点",p:75,d:""}],
  ov:[{w:"2025.04 – 2026.02",t:"日本への交換留学",s:"近畿大学、大阪",d:""}],
  ed:[{w:"[入学年月 – 卒業（予定）年月]",t:"漢城大学校 経営学科",s:"",d:"[成績、関連科目など]"},
      {w:"[受験予定年月]",t:"ITパスポート 取得予定",s:"IPA（情報処理推進機構）",d:""}],
  sk:["Python","Git","Excel"],
  pj:["[プロジェクトサイトのリンク（近日追加）]"],
  foot:"履歴書添付用ページ · 印刷（PDF保存）対応"
}};
/* ===== 수정 끝 / 編集ここまで ===== */

const $ = id => document.getElementById(id);
const tl = a => `<div class="tl">${a.map(i=>`<div class="item"><div class="when">${i.w}</div><div class="what">${i.t}</div>${i.s?`<div class="where">${i.s}</div>`:""}${i.d?`<p>${i.d}</p>`:""}</div>`).join("")}</div>`;

function render(l){
  const d = DATA[l], L = d.labels;
  document.documentElement.lang = l;
  document.title = d.name + " | Portfolio";
  $("photo").innerHTML = PHOTO ? `<img src="${PHOTO}" alt="${d.name}">` : COMMON.initials;
  $("name").textContent = d.name;
  $("role").textContent = d.role;
  $("facts").innerHTML = d.facts.map(f=>`<li>${f}</li>`).join("")
    + `<li><a href="${COMMON.github}">GitHub</a></li><li><a href="mailto:${COMMON.email}">${COMMON.email}</a></li>`;
  $("main").innerHTML =
    `<section><h2>${L.about}</h2>${d.about.map(p=>`<p>${p}</p>`).join("")}</section>`+
    `<section><h2>${L.jp}</h2><div class="jp">${d.jp.map(j=>`<div class="row"><div><b>${j.n}</b> ${j.lv}${j.d?`<small>${j.d}</small>`:""}</div><div class="bar"><i style="width:${j.p}%"></i></div></div>`).join("")}</div></section>`+
    `<section><h2>${L.ov}</h2>${tl(d.ov)}</section>`+
    `<section><h2>${L.ed}</h2>${tl(d.ed)}</section>`+
    `<section><h2>${L.sk}</h2><ul class="tags">${d.sk.map(s=>`<li>${s}</li>`).join("")}</ul></section>`+
    `<section><h2>${L.pj}</h2>${d.pj.map(p=>`<p>${p}</p>`).join("")}</section>`+
    `<footer>${d.foot}</footer>`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l));
  try{ localStorage.setItem("lang", l); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.l)));
let start = "ko";
try{ const s = localStorage.getItem("lang"); if(s && DATA[s]) start = s; }catch(e){}
render(start);
</script>
</body>
</html>
