## 기본 문법
- 자료형: `int` `float` `str` `bool` / 묶음: `list` `dict` `tuple` `set`
- 제어문: `if` `elif` `else`, `for`, `while`
- 함수: `def`로 만들고 `return`으로 결과를 돌려줍니다
```python
sales = [300, 360, 410]               # list
corp = {"name": "A社", "sales": 360}   # dict

def growth(prev, now):                # 함수
    return (now / prev - 1) * 100

rates = [growth(a, b) for a, b in zip(sales, sales[1:])]   # 컴프리헨션
print(rates)   # [20.0, 13.88...]
```

| 라이브러리 | 용도 | 예시 |

## pandas 기본기
```python
import pandas as pd
df = pd.read_excel("fin.xlsx")             # 불러오기
df["성장률"] = df["매출"].pct_change()       # 전기 대비 증감률
df["이익률"] = df["영업이익"] / df["매출"]
df.groupby("업종")["매출"].mean()           # 업종별 평균
df.sort_values("이익률", ascending=False).head()
df.to_excel("result.xlsx", index=False)    # 저장
```
## 회귀분석 맛보기
```python
import statsmodels.api as sm
X = sm.add_constant(df[["환율"]])
model = sm.OLS(df["수출"], X).fit()
print(model.summary())    # 계수, p-value, R²
```
- 기억할 것: 상관관계는 인과관계가 아닙니다. p-value 0.05 미만은 관례적인 기준일 뿐입니다

## 개발 프로세스 (일본어 용어)
| 단계 | 일본어 | 하는 일 | 산출물 |
| 요구분석 | 要件定義 | 고객이 원하는 것을 정리 (기능·비기능) | 요구정의서 |
| 기본설계 | 基本設計 (外部設計) | 화면·기능·데이터를 사용자 시점으로 설계 | 기본설계서 |
| 상세설계 | 詳細設計 (内部設計) | 프로그램 내부 구조 설계 | 상세설계서 |
| 구현 | 製造・プログラミング | 코드 작성, 단위 테스트 | 소스코드 |
| 테스트 | テスト | 결합·시스템·인수 테스트 | 테스트 결과서 |
| 운용·보수 | 運用・保守 | 서비스 운영, 장애 대응, 개선 | 운용 매뉴얼 |
## V모델: 설계와 테스트의 대응
- 상세설계 ↔ 단위테스트(単体テスト)
- 기본설계 ↔ 결합테스트(結合テスト)
- 요구정의 ↔ 시스템테스트(システムテスト) / 인수테스트(受入テスト)
## 워터폴 vs 애자일
| 구분 | 워터폴 | 애자일 |
| 진행 | 단계를 순서대로, 되돌아가지 않음 | 짧은 반복(스프린트)으로 계속 개선 |
| 장점 | 계획·관리가 쉽고 문서가 남음 | 변경에 강하고 피드백이 빠름 |
| 단점 | 후반의 변경이 어렵고 비쌈 | 범위·일정 관리가 어려움 |
| 적합 | 요구가 명확한 대규모 시스템 | 요구가 변하는 신규 서비스 |
- 스크럼: 제품 책임자(PO), 스크럼 마스터, 개발팀 / 백로그, 스프린트(1~4주), 데일리 스크럼, 회고
- 그 외: 프로토타이핑, 나선형 모델, DevOps
## 함께 알아둘 것
- 기능 요구 vs 비기능 요구(성능·보안·가용성·사용성)
- 테스트 기법: 블랙박스(입출력만 봄) / 화이트박스(내부 구조를 봄)
- 프로젝트 관리: WBS(작업 분해), 간트차트, 크리티컬 패스(가장 긴 경로)
- 형상관리: Git으로 변경 이력과 브랜치를 관리
- 일본 현장에서는 **보고·연락·상담(報連相)**과 문서의 정확성이 중요하게 다뤄집니다

## 웹이 동작하는 방식
- 브라우저(클라이언트)가 서버에 **HTTP 요청**을 보내고, 서버가 **응답**(HTML 또는 JSON)을 돌려줍니다
- 서버는 필요하면 DB에서 데이터를 꺼내 응답에 담습니다
- 메서드: `GET` 조회 / `POST` 생성 / `PUT` 수정 / `DELETE` 삭제
- 상태 코드: `200` 성공, `404` 없음, `500` 서버 오류
- 데이터 형식은 주로 **JSON**이고, 이런 요청 창구를 **API**(REST API)라고 부릅니다

## 실습: 미니 위키백과 만들기
- 목표: 문서를 만들고, 검색하고, 고치고, 문서끼리 링크로 연결되는 위키
- 개념 연결: 문서 = 데이터(객체) / 목록·검색 = 화면 다시 그리기 / 편집 = 입력 폼 / 저장 = `localStorage`(브라우저 저장소)
### 1단계. 데이터 구조
```javascript
let pages = JSON.parse(localStorage.getItem("wiki") || "{}");
// 예: { "파이썬": "파이썬은 [[프로그래밍]] 언어입니다", "프로그래밍": "..." }
```

<button id="new">새 문서</button>

### 3단계. JavaScript
```javascript
const $ = id => document.getElementById(id);
let current = "";

function save() { localStorage.setItem("wiki", JSON.stringify(pages)); }

// 목록 + 검색: 제목이나 본문에 검색어가 있으면 보여줌
function renderList() {
  const q = $("q").value.trim();
  $("list").innerHTML = Object.keys(pages)
    .filter(t => t.includes(q) || pages[t].includes(q))
    .map(t => `<li><a href="#${t}">${t}</a></li>`)
    .join("");
}

// 문서 열기: [[문서명]] 을 링크로 바꾸는 것이 위키의 핵심
function openPage() {
  current = decodeURIComponent(location.hash.slice(1));
  $("title").textContent = current;
  $("view").innerHTML = (pages[current] || "")
    .replace(/</g, "&lt;")
    .replace(/\[\[(.+?)\]\]/g, '<a href="#$1">$1</a>')
    .replace(/\n/g, "<br>");
}

$("q").addEventListener("input", renderList);
window.addEventListener("hashchange", openPage);
$("new").onclick = () => {
  const t = prompt("문서 제목");
  if (t) { pages[t] = ""; save(); location.hash = t; renderList(); }
};
$("editBtn").onclick = () => { $("edit").hidden = false; $("edit").value = pages[current] || ""; };

<script type="text/plain" class="nt" data-t="AI 기초 리포트">
## 1. 원리
- **머신러닝**: 사람이 규칙을 쓰는 대신 데이터에서 규칙을 학습하는 방식
- **신경망**: 숫자를 여러 층에서 계산하고, 정답과의 차이(손실)가 줄도록 가중치를 조금씩 고칩니다 (경사하강법)
- **LLM(대규모 언어모델)**: 방대한 텍스트로 "다음에 올 토큰(단어 조각)"을 예측하도록 학습한 모델. 핵심 구조는 **트랜스포머**의 어텐션(문장 속 어떤 단어가 중요한지 계산)
- 학습 순서: 사전학습 → 지시 따르기 학습(파인튜닝) → 사람 피드백으로 다듬기(RLHF 등)
- 용어: 토큰, 컨텍스트 윈도우(한 번에 읽는 길이), 프롬프트, **환각(hallucination)** = 그럴듯하지만 틀린 답
## 2. 모델의 종류와 차이
| 구분 | 특징 | 쓰임 |
| 범용 LLM | 대화·글쓰기·코딩·분석을 폭넓게 처리 | 챗봇형 서비스 전반 |
| 추론 특화 모델 | 답하기 전에 길게 생각, 수학·코딩에 강함 | 복잡한 문제 풀이 |
| 멀티모달 | 텍스트와 이미지·음성을 함께 처리 | 이미지 설명, 표 읽기 |
| 오픈 모델 | 직접 내려받아 운용 가능, 보안 통제에 유리 | 사내 서버 운용 |
| 이미지·영상 생성 | 확산 모델 등으로 이미지를 생성 | 디자인 시안 |
- 모델 이름과 성능은 몇 달 단위로 바뀌므로, 비교는 항상 공식 문서와 최신 자료로 확인합니다
## 3. 활용
- 코딩 보조, 문서 요약·번역, 데이터 정리, 보고서 초안, 회의록
- **RAG**: 사내 문서를 검색해 답변의 근거로 붙이는 방식 (환각을 줄이는 대표 방법)
- **에이전트**: AI가 도구를 직접 써서 여러 단계의 작업을 수행
- 경영·경제 분야: 공시 자료 요약, 시장 보고서 초안, 재무 데이터의 이상치 찾기. 단, 숫자는 반드시 원문으로 검증합니다
## 4. 한계와 주의
- 환각, 편향, 최신 정보 부족
- 기밀 정보와 개인정보를 외부 서비스에 입력하지 않기 (회사 규정 확인)
- 저작권과 출처 확인
## 5. 나의 견해 (초안 — 본인 생각으로 고쳐 쓰세요)
- AI는 일을 대체하는 존재라기보다 **일의 속도를 바꾸는 도구**라고 봅니다. 결과를 검증하는 사람의 판단이 더 중요해집니다
- 비전공자에게는 오히려 기회입니다. 경영·경제 지식으로 "무엇을 물을지"를 알고, AI로 구현 속도를 높일 수 있기 때문입니다
- 다만 원리를 모르면 결과를 의심할 수 없으므로, 기초(Python·데이터·소프트웨어공학)를 쌓는 것이 먼저라고 생각합니다
- IT 업계에서는 고객의 요구를 정확히 듣고 정리하는 능력(要件定義)이 AI 시대에도 가치가 있다고 봅니다
</script>
<script type="text/plain" class="nt" data-t="자료구조·알고리즘">
## 자료구조
| 구조 | 특징 | 파이썬 |
| 리스트 | 순서가 있는 묶음, 인덱스로 접근 | `[1, 2, 3]` |
| 딕셔너리 | 키→값, 조회가 빠름 | `{"a": 1}` |
| 집합 | 중복 없음 | `{1, 2, 3}` |
| 스택 | 나중에 넣은 것을 먼저 꺼냄 (LIFO) | `list.append / pop` |
| 큐 | 먼저 넣은 것을 먼저 꺼냄 (FIFO) | `collections.deque` |
| 트리·그래프 | 계층·연결 관계 (개념만) | |
```python
stack = []; stack.append(1); stack.append(2); stack.pop()   # 2
from collections import deque
q = deque(); q.append(1); q.append(2); q.popleft()          # 1
price = {"A": 120, "B": 95}; price["A"]                     # 120 (빠른 조회)
```
## 시간복잡도 (Big-O)
| 표기 | 의미 | 예 |
| O(1) | 데이터 양과 상관없이 일정 | 딕셔너리 조회 |
| O(log n) | 절반씩 줄여 나감 | 이진탐색 |
| O(n) | 데이터 양에 비례 | 리스트 전체 훑기 |
| O(n²) | 이중 반복 | 단순 정렬(버블정렬) |
## 탐색
```python
def linear(a, x):                 # 선형탐색 O(n)
    for i, v in enumerate(a):
        if v == x: return i
    return -1

def binary(a, x):                 # 이진탐색 O(log n), 정렬된 리스트만
    lo, hi = 0, len(a) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if a[mid] == x: return mid
        if a[mid] < x: lo = mid + 1
        else: hi = mid - 1
    return -1
```
## 정렬과 재귀
```python
def bubble(a):                    # 이웃끼리 비교해 교환 O(n²)
    for i in range(len(a)):
        for j in range(len(a) - 1 - i):
            if a[j] > a[j+1]: a[j], a[j+1] = a[j+1], a[j]
    return a

sorted([3, 1, 2])                 # 실무에서는 내장 정렬 사용 O(n log n)

def fact(n):                      # 재귀: 자기 자신을 호출
    return 1 if n <= 1 else n * fact(n - 1)
```
- 기억할 것: 먼저 맞게 동작하도록 만들고, 느릴 때 개선합니다

  const profileHTML =
    `<section><h2>${L.about}</h2>${d.about.map(p=>`<p>${p}</p>`).join("")}</section>`+
    `<section><h2>${L.jp}</h2><div class="jp">${d.jp.map(j=>`<div class="row"><div><b>${j.n}</b> ${j.lv}${j.d?`<small>${j.d}</small>`:""}</div><div class="bar"><i style="width:${j.p}%"></i></div></div>`).join("")}</div></section>`+
    `<section><h2>${L.en}</h2><div class="jp">${d.en.map(j=>`<div class="row"><div><b>${j.n}</b> ${j.lv}${j.d?`<small>${j.d}</small>`:""}</div><div class="bar"><i style="width:${j.p}%"></i></div></div>`).join("")}</div></section>`+
    `<section><h2>${L.ov}</h2>${tl(d.ov)}</section>`+
    `<section><h2>${L.ed}</h2>${tl(d.ed)}</section>`+
    `<section><h2>${L.sk}</h2><ul class="tags">${d.sk.map(s=>`<li>${s}</li>`).join("")}</ul></section>`+
    `<section><h2>${L.pj}</h2>${d.pj.map(p=>`<p>${p}</p>`).join("")}</section>`+
    `<footer>${d.foot}</footer>`;
  $("main").innerHTML = view==="pf" ? pfHTML(l) : view==="study" ? studyHTML(l) : profileHTML;
  $("sheets").innerHTML = ["profile","pf","study"].map((k,i)=>`<button data-v="${k}" aria-pressed="${k===view}">${VIEWS[l][i]}</button>`).join("");
  $("sheets").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.v;render(LANG);window.scrollTo(0,0)}));
  document.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>{note=+b.dataset.n;render(LANG)}));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l));
  try{ localStorage.setItem("lang", l); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.l)));
let start = "ko";
try{ const s = localStorage.getItem("lang"); if(s && DATA[s]) start = s; }catch(e){}
render(start);
</script>
</body>
</html>
