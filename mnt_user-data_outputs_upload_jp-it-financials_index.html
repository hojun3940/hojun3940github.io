<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본 IT 기업 재무 비교 분석</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#e3e1da; --accent:#264b7a; --accent-soft:#e8eef6; --neg:#b4483c; --warn:#fff4d6; --warn-ink:#6b4e00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14181f;--surface:#1b212b;--ink:#e9ecf2;--muted:#9aa3b5;--line:#2c3441;--accent:#8fb4e8;--accent-soft:#222c3b;--neg:#e58a7e;--warn:#3a3217;--warn-ink:#f0d98a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14181f;--surface:#1b212b;--ink:#e9ecf2;--muted:#9aa3b5;--line:#2c3441;--accent:#8fb4e8;--accent-soft:#222c3b;--neg:#e58a7e;--warn:#3a3217;--warn-ink:#f0d98a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.75;font-size:16px}
html[lang="ja"] body{font-family:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:40px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px;font-size:14px}
.top a{color:var(--muted);text-underline-offset:3px}
.lang,.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:6px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:500}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:30px;line-height:1.3;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.banner{background:var(--warn);color:var(--warn-ink);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:28px}
section{padding-bottom:32px}
h2{font-size:20px;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
p{margin:0 0 12px;max-width:66ch}
.chart{margin-top:16px;display:grid;gap:10px}
.crow{display:grid;grid-template-columns:130px 1fr 80px;gap:12px;align-items:center;font-size:15px}
.track{height:20px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.track i.neg{background:var(--neg)}
.crow output{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.note{color:var(--muted);font-size:13px}
ul{margin:0;padding-left:20px}
li{margin-bottom:6px;max-width:66ch}
.insight{background:var(--accent-soft);border-radius:8px;padding:14px 16px}
@media (max-width:600px){.crow{grid-template-columns:90px 1fr 64px;gap:8px}}
@media print{.lang,.tabs{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a id="back" href="#"></a>
    <div class="lang" role="group" aria-label="Language"><button data-l="ko">한국어</button><button data-l="ja">日本語</button></div>
  </div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="banner" id="banner"></div>
  <main id="main"></main>
</div>

<script>
/* ===== 여기만 수정하세요 / ここだけ編集してください =====
   회사와 숫자를 실제 공시(EDINET·결산단신) 값으로 교체합니다. 단위: 億円(억 엔)
   prev = 전기 매출, rev = 당기 매출, op = 당기 영업이익 */
const PORTFOLIO_URL = "https://hojun3940.github.io";
const FY = "FY[20XX]";
const COMPANIES = [
  {ko:"샘플 회사 A (SaaS)",  ja:"サンプルA社（SaaS）", prev:300,  rev:360,  op:36},
  {ko:"샘플 회사 B (SaaS)",  ja:"サンプルB社（SaaS）", prev:800,  rev:880,  op:132},
  {ko:"샘플 회사 C (성장)",  ja:"サンプルC社（成長）", prev:150,  rev:210,  op:-15},
  {ko:"샘플 회사 D (SIer)",  ja:"サンプルD社（SIer）", prev:2000, rev:2100, op:210}
];
/* ===== 수정 끝 / 編集ここまで ===== */

const T = {
ko:{
  back:"← 포트폴리오", title:"일본 IT 기업 재무 비교 분석", sub:"매출 성장률과 수익성으로 본 일본 IT·SaaS 기업 (단위: 억 엔)",
  banner:"현재 표시된 회사와 수치는 레이아웃 확인용 샘플입니다. 실제 공시 자료로 교체될 예정입니다.",
  metrics:{rev:"매출액",growth:"매출 성장률",margin:"영업이익률",r40:"Rule of 40"},
  h:{chart:"지표별 비교",table:"재무 데이터",insight:"분석 요약",method:"분석 방법",src:"데이터 출처"},
  cols:["회사","전기 매출","당기 매출","영업이익","성장률","영업이익률","Rule of 40"],
  ins:(a,b,m)=>`Rule of 40 기준 1위는 ${a.n}(${a.v}%)입니다. 영업이익률은 ${b.n}이(가) ${b.v}%로 가장 높습니다. ${m}`,
  insTail:"이 요약은 입력된 수치로 자동 계산됩니다.",
  method:["매출 성장률 = (당기 매출 ÷ 전기 매출) − 1","영업이익률 = 영업이익 ÷ 당기 매출","Rule of 40 = 매출 성장률 + 영업이익률. SaaS 기업의 성장과 수익의 균형을 보는 경험칙이며, 40%를 넘으면 양호하다고 봅니다. 이 페이지에서는 영업이익률로 단순화했습니다.","회사 유형(SaaS, SIer)에 따라 사업 구조가 달라, 같은 지표라도 해석이 달라질 수 있습니다."],
  src:["EDINET (금융청 전자공시)","각 사 결산단신·유가증권보고서","JPX (일본거래소그룹) 상장사 정보"]
},
ja:{
  back:"← ポートフォリオ", title:"日本IT企業の財務比較分析", sub:"売上成長率と収益性で見る日本のIT・SaaS企業（単位：億円）",
  banner:"現在表示している企業と数値はレイアウト確認用のサンプルです。実際の開示資料に差し替える予定です。",
  metrics:{rev:"売上高",growth:"売上成長率",margin:"営業利益率",r40:"Rule of 40"},
  h:{chart:"指標別比較",table:"財務データ",insight:"分析サマリー",method:"分析方法",src:"データ出典"},
  cols:["企業","前期売上","当期売上","営業利益","成長率","営業利益率","Rule of 40"],
  ins:(a,b,m)=>`Rule of 40 の首位は${a.n}（${a.v}%）です。営業利益率は${b.n}が${b.v}%で最も高くなっています。${m}`,
  insTail:"このサマリーは入力した数値から自動計算しています。",
  method:["売上成長率 ＝ （当期売上 ÷ 前期売上）− 1","営業利益率 ＝ 営業利益 ÷ 当期売上","Rule of 40 ＝ 売上成長率 ＋ 営業利益率。SaaS企業の成長と収益のバランスを見る経験則で、40%以上が目安です。本ページでは営業利益率で簡略化しています。","企業タイプ（SaaS、SIer）で事業構造が異なるため、同じ指標でも解釈が変わる点に注意が必要です。"],
  src:["EDINET（金融庁 電子開示システム）","各社の決算短信・有価証券報告書","JPX（日本取引所グループ）上場会社情報"]
}};

const $ = id => document.getElementById(id);
const pct = x => Math.round(x*1000)/10;
const rows = () => COMPANIES.map(c=>{const g=c.rev/c.prev-1, m=c.op/c.rev; return {...c, g:pct(g), m:pct(m), r:pct(g+m)};});
let lang="ko", metric="r40";

function val(r,k){return k==="rev"?r.rev:k==="growth"?r.g:k==="margin"?r.m:r.r}
function fmt(r,k){return k==="rev"?r.rev.toLocaleString():val(r,k)+"%"}

function render(){
  const t=T[lang], R=rows();
  document.documentElement.lang=lang;
  document.title=t.title;
  $("back").textContent=t.back; $("back").href=PORTFOLIO_URL;
  $("title").textContent=t.title; $("sub").textContent=t.sub; $("banner").textContent=t.banner;
  const vals=R.map(r=>Math.abs(val(r,metric))), max=Math.max(...vals,1);
  const top=k=>{const s=[...R].sort((a,b)=>val(b,k)-val(a,k))[0];return {n:s[lang],v:val(s,k)}};
  $("main").innerHTML=
   `<section><h2>${t.h.chart}</h2><div class="tabs" role="group">${Object.keys(t.metrics).map(k=>`<button data-m="${k}" aria-pressed="${k===metric}">${t.metrics[k]}</button>`).join("")}</div>
    <div class="chart">${R.map(r=>{const v=val(r,metric);return `<div class="crow"><span>${r[lang]}</span><div class="track"><i class="${v<0?"neg":""}" style="width:${Math.abs(v)/max*100}%"></i></div><output>${fmt(r,metric)}</output></div>`}).join("")}</div></section>
   <section><h2>${t.h.table}</h2><div class="scroll"><table><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${R.map(r=>`<tr><td>${r[lang]}</td><td>${r.prev.toLocaleString()}</td><td>${r.rev.toLocaleString()}</td><td>${r.op.toLocaleString()}</td><td>${r.g}%</td><td>${r.m}%</td><td>${r.r}%</td></tr>`).join("")}</tbody></table></div><p class="note">${FY}</p></section>
   <section><h2>${t.h.insight}</h2><div class="insight">${t.ins(top("r40"),top("margin"),t.insTail)}</div></section>
   <section><h2>${t.h.method}</h2><ul>${t.method.map(m=>`<li>${m}</li>`).join("")}</ul></section>
   <section><h2>${t.h.src}</h2><ul>${t.src.map(s=>`<li>${s}</li>`).join("")}</ul></section>`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{metric=b.dataset.m;render()}));
  try{localStorage.setItem("lang",lang)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;render()}));
try{const s=localStorage.getItem("lang"); if(s&&T[s]) lang=s}catch(e){}
render();
</script>
</body>
</html>
